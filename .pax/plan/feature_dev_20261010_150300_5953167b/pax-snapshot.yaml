plan:
  id: lo-wasm-spike-20261010
  status: frozen
  frozen_at: "2026-10-10T15:03:00+08:00"
  frozen_by: user
  steps:
    - id: S1
      action: 在会话工作台建立独立 spike 目录 spike/lo-wasm，npm 安装 @matbee/libreoffice-converter（约 65MB）
      rollback: 删除该目录
    - id: S2
      action: 检查包内 wasm/data/worker 资源路径与 browser 入口、createWasmPaths 用法
      rollback: 不适用
    - id: S3
      action: 编写极简静态服务器（node:http），设置 COOP: same-origin + COEP: require-corp，托管 wasm 资源、worker.js、样例 .doc/.ppt 与测试页
      rollback: 删除 spike 目录
    - id: S4
      action: 内置浏览器打开测试页，运行转换，采集 初始化耗时 / 内存峰值 / 成功或失败 / 中文字形
