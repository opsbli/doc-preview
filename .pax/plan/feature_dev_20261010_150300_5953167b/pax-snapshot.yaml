goal:
  statement: >-
    做一个限时技术验证（约 1-2 小时）：用 @matbee/libreoffice-converter（LibreOffice WASM，约 65MB）
    在浏览器路径下转换真实 .doc / .ppt 文件为 PDF，验证 4 个 go/no-go 假设：
    能否正确转换、首次初始化耗时、内存峰值、不加 CJK 字体时中文表现。
    用户已批准引入该依赖并跑此 spike；验证通过则立项（按 feature_dev 重新编排），不通过则维持现状。
  success_criteria:
    - 产出可复现的验证环境（独立 spike 目录，不污染仓库）与测试页
    - 对用户 RAR 中的真实 验收DOC.doc / 验收ppt.ppt 给出转换结果（成功/失败、产物是否可用）
    - 记录首次初始化耗时与内存峰值（浏览器 Performance API）
    - 判断不加 CJK 字体时中文是否缺字（关键：验收文件为中文）
    - 输出明确的 go / no-go 结论与依据

consensus:
  required_precision: low
  dimensions:
    goal:
      status: confirmed
      content: 用户确认跑限时技术验证；通过则立项、不通过维持现状。
    success_criteria:
      status: confirmed
      content: 见 goal.success_criteria（5 项）。
    constraints:
      status: confirmed
      content: >-
        验证环境放在会话工作台独立目录，不修改仓库（不碰 package.json/lockfile/源码）。
        依赖经 npm 装进 spike 目录本身。spike 时间盒约 1-2 小时。
        网络走内置浏览器（项目 AGENTS.md 联网规则与既往一致：chrome_devtools MCP 不可用，改用内置浏览器，已在交付物标注）。
    authorization:
      status: confirmed
      content: 用户批准引入 @matbee/libreoffice-converter（约 65MB 下载）用于本 spike。
    exceptions:
      status: not_applicable
      content: 无。
    terminology:
      status: confirmed
      content: >-
        go = 转换正确 + 初始化+内存可接受 + 中文可渲染（含或不含字体包）→ 视为值得立项评估；
        no-go = 转换失败 / 初始化过慢 / 内存不可接受 / 中文必须依赖数百 MB 字体包而用户不接受 → 维持现状。
