      content: 无。
    terminology:
      status: confirmed
      content: >-
        自包含 = 使用方无需在构建产物外额外部署 .wasm / worker 文件。
        资源契约变更 = 需要使用方把 .wasm 或 worker 放到可访问路径并传入 URL。
  design_tree:
    - 选型结论：7z-wasm@1.2.0（基于 7-Zip 24.09）同时覆盖 7z 与 rar（随包附 unRarLicense.txt，keywords 含 rar）
    - 自包含可行性已取证：SevenZipModuleOptions 含 wasmBinary: ArrayBuffer 与 locateFile，可注入 wasm 字节，免使用方部署资源
    - 7zz.es6.js 无 import 语句、不引用 readline-sync（唯一 runtime 依赖只在 Node 分支）；仅含 ENVIRONMENT_IS_NODE 分支里的 require('fs'|'path'|'url'|'crypto')
    - 交付形态（用户已选 A1）：构建时将 7zz.wasm 以 base64 内联进按需 chunk（约 2.2MB），并在包内附 7-Zip / unRAR 许可声明
    - 执行环境（用户已选）：在 Web Worker 中执行（WORKERFS），不阻塞 UI
    - 分层：纯编排逻辑放 utils/sevenZipCore.ts（可被 node 直接测试），worker 文件仅做 wasm 内联与消息转发
    - 许可影响：本库产物将内嵌 LGPL-2.1+ 与 unRAR restriction 代码，需在 NOTICE/文档中声明；unRAR 不得用于再造 RAR 压缩算法，且不得对分发收费
  gaps_remaining:
    - rar 端到端验证需真实 .rar 样本（7-Zip 不能生成 rar）；能力以 7zz 编译进去的格式列表与随包 unRarLicense 为证，端到端待用户提供样本
