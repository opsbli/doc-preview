    为 doc-preview 补齐 7z / rar 压缩包预览能力（在 P0 批次中因资源部署契约冲突被收窄），
    随后评估并实现 P1 缺口批次（ofd / rtf / drawio / vsd-vsdx / dcm / three.js 可覆盖的 3D 扩展 / HTML 渲染模式）。
    用户已确认顺序：先 7z/rar，再 P1。
  success_criteria:
    - 给出 7z/rar 的可行技术选型结论，含与之绑定的「使用方是否需要额外部署静态资源」契约。
    - 选定方案后，core 可列举并读取 7z 与 rar 条目，双端 Archive 渲染器无需改动即可预览。
    - WASM 解压器必须按需加载（对应 chunk 不进主 bundle），失败时给出明确提示而非静默失败。
    - 方案落地后 pnpm run test / lint / build 全部通过。
    - P1 批次逐项给出可行性、成本与依赖，经用户确认子集后再实现。

